ts + 1, status = 'pending', last_error = NULL \"\n            \"WHERE shop_id = :shop_id AND draft_id = :id\", id=draft_id,\n        )\n        message = OutboundMessage(key, customer[\"phone_e164\"], d[\"body\"], \"sms\")\n        log.info(\"sending draft %s to %s\", draft_id, customer[\"phone_e164\"])   # the logger masks the number\n        quote_id = d[\"quote_id\"]\n\n    # Committed. A crash from here leaves the draft in `sending`, which nothing will resend.\n    result = sender.send(message)\n\n    with session.tx():\n        if result.status == \"accepted\":\n            _mark_sent(session, draft_id, quote_id, now, result.provider_message_id)\n            return {\"result\": \"sent\", \"status\": \"sent\", \"provider_message_id\": result.provider_message_id}\n        if result.status == \"rejected\":\n            session.run(\n                \"UPDATE drafts SET status = 'failed', status_reason = :why WHERE shop_id = :shop_id AND id = :id\",\n                id=draft_id, why=result.error or \"provider rejected\",\n            )\n            session.run(\n                \"UPDATE outbox SET status = 'failed', last_error = :why WHERE shop_id = :shop_id AND draft_id = :id\",\n                id=draft_id, why=result.error or \"provider rejected\",\n            )\n            return {\"result\": \"failed\", \"status\": \"failed\", \"reason\": result.error}\n        session.run(\n            \"UPDATE outbox SET status = 'unknown', last_error = :why WHERE shop_id = :shop_id AND draft_id = :id\",\n            id=draft_id, why=result.error or \"timeout\",\n        )\n        session.run(\n            \"UPDATE drafts SET status_reason = 'provider did not answer, reconcile before any retry' \"\n            \"WHERE shop_id = :shop_id AND id = :id\", id=draft_id,\n        )\n        return {\"result\": \"unknown\", \"status\": \"sending\", \"reason\": \"provider did not answer\"}\n\n\ndef _mark_sent(session: ShopSession, draft_id: str, quote_id: str, now: datetime, provider_id: str | None) -> None:\n    session.run(\n        \"UPDATE drafts SET status = 'sent', status_reason = NULL WHERE shop_id = :shop_id AND id = :id\", id=draft_id,\n    )\n    session.run(\n        \"UPDATE outbox SET status = 'sent', sent_at = :at, provider_message_id = :pid \"\n        \"WHERE shop_id = :shop_id AND draft_id = :id\", id=draft_id, at=iso(now), pid=provider_id,\n    )\n    session.run(\n        \"UPDATE offers SET status = 'sent' WHERE shop_id = :shop_id AND draft_id = :id AND status = 'proposed'\",\n        id=draft_id,\n    )\n    # Close the loop. Our own send becomes an event, so last contact has one source.\n    eventlog.append(session, {\n        \"event_id\": \"sent:\" + draft_id, \"quote_id\": quote_id, \"type\": \"message_sent\",\n        \"occurred_at\": iso(now), \"channel\": \"sms\", \"direction\": \"outbound\",\n        \"raw\": {\"source\": \"followup-engine\", \"draft_id\": draft_id},\n    })\n\n\ndef reconcile(session: ShopSession, draft_id: str, now: datetime, sender: Sender) -> dict[str, Any]:\n    \"\"\"Settle a draft stuck in `sending` by asking the provider what happened.\"\"\"\n    with session.tx():\n        d = get_draft(session, draft_id)\n        if d[\"status\"] != \"sending\":\n            return {\"result\": \"noop\", \"status\": d[\"status\"], \"reason\": \"draft is not waiting on the provider\"}\n        found = sender.lookup(f\"{session.shop_id}:{draft_id}\")\n        if found is not None and found.status == \"accepted\":\n            _mark_sent(session, draft_id, d[\"quote_id\"], now, found.provider_message_id)\n            return {\"result\": \"sent\", \"status\": \"sent\", \"reason\": \"provider confirms delivery\"}\n        session.run(\n            \"UPDATE drafts SET status = 'failed', status_reason = 'provider has no record, safe to retry' \"\n            \"WHERE shop_id = :shop_id AND id = :id\", id=draft_id,\n        )\n        session.run(\n            \"UPDATE outbox SET status = 'failed', last_error = 'provider has no record' \"\n            \"WHERE shop_id = :shop_id AND draft_id = :id\", id=draft_id,\n        )\n        return {\"result\": \"failed\", \"status\": \"failed\", \"reason\": \"provider has no record, safe to retry\"}\n", "followup/guard/__init__.py": "\"\"\"Guard: the only module that can block a message. Plain code, not a model.\"\"\"\nfrom .limits import in_quiet_hours\nfrom .send_rules import SendFacts, Verdict, check_send\nfrom .text_rules import TextContext, Violation, body_hash, build_context, check_text\n\n__all__ = [\"in_quiet_hours\", \"SendFacts\", \"Verdict\", \"check_send\", \"TextContext\", \"Violation\",\n           \"body_hash\", \"build_context\", \"check_text\"]\n", "followup/guard/limits.py": "\"\"\"Limits that are about time and volume.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import datetime, timedelta\n\nfrom ..platform.config import ShopConfig\n\n\ndef local_hour(now: datetime, config: ShopConfig) -> int:\n    return (now + timedelta(hours=config.utc_offset_hours)).hour\n\n\ndef in_quiet_hours(now: datetime, config: ShopConfig) -> bool:\n    \"\"\"True when the shop should not be texting customers.\"\"\"\n    if not config.quiet_hours_enabled:\n        return False\n    hour = local_hour(now, config)\n    return not (config.quiet_start_hour <= hour < config.quiet_end_hour)\n", "followup/guard/send_rules.py": "\"\"\"Checks run inside the send transaction, after the draft is claimed. Pure.\n\nA draft can sit for hours between approval and send. Everything is checked again here.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import datetime\n\nfrom ..platform.timeutil import hours_between\n\n\n@dataclass(frozen=True)\nclass SendFacts:\n    now: datetime\n    quote_status: str\n    customer_last_contact: datetime | None     # across all of the customer's quotes\n    customer_last_reply: datetime | None\n    cooldown_hours: float\n    body_hash: str\n    approved_body_hash: str | None\n    decided_by: str | None\n    offer_expires_at: datetime | None = None\n    slot_ref: str | None = None\n    slot_open: bool = True\n    shop_sending_enabled: bool = True\n    global_sending_enabled: bool = True\n    sent_last_24h: int = 0\n    daily_send_cap: int = 50\n    in_quiet_hours: bool = False\n\n\n@dataclass(frozen=True)\nclass Verdict:\n    action: str        # ok, skip, refuse, defer\n    rule: str = \"\"\n    reason: str = \"\"\n\n    @property\n    def ok(self) -> bool:\n        return self.action == \"ok\"\n\n    def to_dict(self) -> dict:\n        return {\"action\": self.action, \"rule\": self.rule, \"reason\": self.reason}\n\n\ndef is_human(actor: str | None) -> bool:\n    return bool(actor) and actor.startswith(\"user:\")\n\n\ndef check_send(f: SendFacts) -> Verdict:\n    # Kill switches first. Nothing leaves while they are off.\n    if not f.global_sending_enabled:\n        return Verdict(\"refuse\", \"kill_switch\", \"sending is switched off for the platform\")\n    if not f.shop_sending_enabled:\n        return Verdict(\"refuse\", \"kill_switch\", \"sending is switched off for this shop\")\n\n    # Approval. A human approved exactly this text.\n    if not is_human(f.decided_by) or not f.approved_body_hash:\n        return Verdict(\"refuse\", \"no_approval\", \"no human approval on record\")\n    if f.body_hash != f.approved_body_hash:\n        return Verdict(\"refuse\", \"hash_mismatch\", \"text changed after approval\")\n\n    # The assignment's guardrails.\n    if f.quote_status != \"open\":\n        return Verdict(\"skip\", \"closed_quote\", f\"quote is {f.quote_status}\")\n    if f.customer_last_contact is not None:\n        replied_since = f.customer_last_reply is not None and f.customer_last_reply > f.customer_last_contact\n        if not replied_since and hours_between(f.customer_last_contact, f.now) < f.cooldown_hours:\n            waited = hours_between(f.customer_last_contact, f.now)\n            return Verdict(\"skip\", \"cooldown\", f\"customer was contacted {waited:.0f} hours ago\")\n\n    # Offers must still be true when the message goes out.\n    if f.offer_expires_at is not None and f.offer_expires_at <= f.now:\n        return Verdict(\"skip\", \"offer_expired\", \"the offer or hold expired before sending\")\n    if f.slot_ref and not f.slot_open:\n        return Verdict(\"skip\", \"slot_filled\", \"the opening behind this offer has been filled\")\n\n    # Limits that wait, not fail.\n    if f.sent_last_24h >= f.daily_send_cap:\n        return Verdict(\"defer\", \"daily_cap\", f\"daily cap of {f.daily_send_cap} sends reached\")\n    if f.in_quiet_hours:\n        return Verdict(\"defer\", \"quiet_hours\", \"outside the shop's sending hours\")\n    return Verdict(\"ok\")\n", "followup/guard/text_rules.py": "\"\"\"Checks on proposed message text. Pure.\n\nThe rules do not trust the writer. Any dollar figure, percent or date in the text\nmust be one the policy engine put on the draft. That holds for a template, a model,\nor a model that has been talked into something by a customer's reply.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport re\nfrom dataclasses import dataclass, field\n\nMONTHS = [\"jan\", \"feb\", \"mar\", \"apr\", \"may\", \"jun\", \"jul\", \"aug\", \"sep\", \"oct\", \"nov\", \"dec\"]\n\n_MONEY = re.compile(r\"\\$\\s?(\\d[\\d,]*(?:\\.\\d{1,2})?)(?:\\s?([kK])\\b)?\")\n_DOLLAR_WORDS = re.compile(r\"\\b(\\d[\\d,]*(?:\\.\\d{1,2})?)(?:\\s?([kK])\\b)?\\s?(?:dollars|bucks|usd)\\b\", re.I)\n_PERCENT = re.compile(r\"(\\d+(?:\\.\\d+)?)\\s?(?:%|percent\\b|pct\\b)\", re.I)\n_DATE_NAMED = re.compile(r\"\\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?\\s+(\\d{1,2})\\b\", re.I)\n_DATE_NUMERIC = re.compile(r\"\\b(\\d{1,2})/(\\d{1,2})(?:/\\d{2,4})?\\b\")\n_DISCOUNT = re.compile(\n    r\"\\b(discount\\w*|coupon\\w*|rebate\\w*|sale price|half[- ]price|percent off|money off|\"\n    r\"knock\\w* \\S+ off|take \\S+ off|price cut|mark\\w* down|cheaper)\\b\", re.I)\n_URL = re.compile(r\"(https?://|www\\.|\\b[\\w-]+\\.(?:com|net|org|io|co|ly|me|biz|info)\\b)\", re.I)\n_EMAIL = re.compile(r\"\\b[\\w.+-]+@[\\w-]+\\.\\w+\")\n_PHONE = re.compile(r\"\\+?\\d[\\d\\-\\s().]{7,}\\d\")\n_BAD_CHARS = re.compile(r\"[<>{}\\[\\]`\\\\]\")\n\n\n@dataclass(frozen=True)\nclass Violation:\n    rule: str\n    detail: str\n\n    def to_dict(self) -> dict:\n        return {\"rule\": self.rule, \"detail\": self.detail}\n\n\n@dataclass(frozen=True)\nclass TextContext:\n    \"\"\"Everything the text rules compare against. Stored on the draft as allowed_json.\"\"\"\n    customer_first: str\n    allowed_money_cents: tuple[int, ...] = ()\n    allowed_dates: tuple[tuple[int, int], ...] = ()      # (month, day)\n    has_costed_offer: bool = False\n    forbidden_terms: tuple[str, ...] = ()                # other customers, schedule details\n    blocked_words: tuple[str, ...] = ()\n    max_chars: int = 320\n\n    def to_dict(self) -> dict:\n        return {\n            \"customer_first\": self.customer_first,\n            \"allowed_money_cents\": list(self.allowed_money_cents),\n            \"allowed_dates\": [list(d) for d in self.allowed_dates],\n            \"has_costed_offer\": self.has_costed_offer,\n            \"forbidden_terms\": list(self.forbidden_terms),\n            \"blocked_words\": list(self.blocked_words),\n            \"max_chars\": self.max_chars,\n        }\n\n    @staticmethod\n    def from_dict(d: dict) -> \"TextContext\":\n        return TextContext(\n            customer_first=d[\"customer_first\"],\n            allowed_money_cents=tuple(d.get(\"allowed_money_cents\", ())),\n            allowed_dates=tuple((int(m), int(day)) for m, day in d.get(\"allowed_dates\", ())),\n            has_costed_offer=bool(d.get(\"has_costed_offer\")),\n            forbidden_terms=tuple(d.get(\"forbidden_terms\", ())),\n            blocked_words=tuple(d.get(\"blocked_words\", ())),\n            max_chars=int(d.get(\"max_chars\", 320)),\n        )\n\n\ndef body_hash(body: str) -> str:\n    return hashlib.sha256(body.encode(\"utf-8\")).hexdigest()\n\n\ndef build_context(\n    customer_first: str,\n    amount_cents: int,\n    framing: dict | None,\n    offer: dict | None,\n    expires_month_day: tuple[int, int] | None,\n    forbidden_terms: tuple[str, ...],\n    blocked_words: tuple[str, ...],\n    max_chars: int,\n) -> TextContext:\n    money = {int(amount_cents)}\n    if framing:\n        money.update(int(v) for v in framing.get(\"numbers_cents\", {}).values())\n    if offer and offer.get(\"value_cents\"):\n        money.add(int(offer[\"value_cents\"]))\n    return TextContext(\n        customer_first=customer_first,\n        allowed_money_cents=tuple(sorted(money)),\n        allowed_dates=(expires_month_day,) if expires_month_day else (),\n        has_costed_offer=bool(offer and offer.get(\"value_cents\")),\n        forbidden_terms=forbidden_terms,\n        blocked_words=blocked_words,\n        max_chars=max_chars,\n    )\n\n\ndef _to_cents(number: str, k: str | None) -> int:\n    value = float(number.replace(\",\", \"\"))\n    if k:\n        value *= 1000\n    return int(round(value * 100))\n\n\ndef check_text(body: str, ctx: TextContext) -> list[Violation]:\n    out: list[Violation] = []\n    text = body or \"\"\n\n    # Shape.\n    if not text.strip():\n        return [Violation(\"shape\", \"empty message\")]\n    if len(text) > ctx.max_chars:\n        out.append(Violation(\"shape\", f\"{len(text)} characters, limit is {ctx.max_chars}\"))\n    if _BAD_CHARS.search(text) or any(ord(ch) < 32 and ch not in \"\\n\" for ch in text):\n        out.append(Violation(\"shape\", \"markup or control characters\"))\n\n    # Money. Every figure must be one the policy put on the draft.\n    allowed = set(ctx.allowed_money_cents)\n    for match in list(_MONEY.finditer(text)) + list(_DOLLAR_WORDS.finditer(text)):\n        cents = _to_cents(match.group(1), match.group(2))\n        if cents not in allowed:\n            out.append(Violation(\"money\", f\"{match.group(0).strip()} is not a figure on this draft\"))\n    for match in _PERCENT.finditer(text):\n        out.append(Violation(\"money\", f\"{match.group(0).strip()} is not a figure on this draft\"))\n\n    # Dates.\n    dates = set(ctx.allowed_dates)\n    for match in _DATE_NAMED.finditer(text):\n        found = (MONTHS.index(match.group(1).lower()[:3]) + 1, int(match.group(2)))\n        if found not in dates:\n            out.append(Violation(\"dates\", f\"{match.group(0)} is not the expiry on this draft\"))\n    for match in _DATE_NUMERIC.finditer(text):\n        found = (int(match.group(1)), int(match.group(2)))\n        if found not in dates:\n            out.append(Violation(\"dates\", f\"{match.group(0)} is not the expiry on this draft\"))\n\n    # Discount language with no offer behind it.\n    if not ctx.has_costed_offer:\n        match = _DISCOUNT.search(text)\n        if match:\n            out.append(Violation(\"no_offer_granted\", f\"'{match.group(0)}' but this draft has no offer\"))\n\n    # Contact details.\n    if _URL.search(text):\n        out.append(Violation(\"contact_details\", \"contains a link\"))\n    if _EMAIL.search(text):\n        out.append(Violation(\"contact_details\", \"contains an email address\"))\n    for match in _PHONE.finditer(text):\n        if len(re.sub(r\"\\D\", \"\", match.group(0))) >= 7:\n            out.append(Violation(\"contact_details\", \"contains a phone number\"))\n            break\n\n    # Names and other jobs.\n    if ctx.customer_first and not re.search(r\"\\b\" + re.escape(ctx.customer_first) + r\"\\b\", text):\n        out.append(Violation(\"names\", \"does not address this customer by name\"))\n    for term in ctx.forbidden_terms:\n        if term and re.search(r\"\\b\" + re.escape(term) + r\"\\b\", text):\n            out.append(Violation(\"names\", \"names another customer or job\"))\n            break\n\n    # Promises.\n    for word in ctx.blocked_words:\n        if re.search(r\"\\b\" + re.escape(word) + r\"\\b\", text, re.I):\n            out.append(Violation(\"promises\", f\"'{word}' is on the shop's block list\"))\n\n    return out\n", "followup/ingestion/__init__.py": "\"\"\"Ingestion engine: validate, normalise, dedupe, append to the event log.\"\"\"\nfrom .engine import IngestReport, ingest_events, ingest_lines, load_quotes, normalise_phone\n\n__all__ = [\"IngestReport\", \"ingest_events\", \"ingest_lines\", \"load_quotes\", \"normalise_phone\"]\n", "followup/ingestion/engine.py": "\"\"\"Ingestion engine.\n\nTakes raw webhook payloads or seed lines. Stores every valid event once.\nNothing here decides what an event means. That is the state module's job.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport re\nfrom dataclasses import asdict, dataclass, field\nfrom typing import Any, Iterable\n\nfrom ..platform import eventlog\nfrom ..platform.db import ShopSession\nfrom ..platform.redact import get_logger\nfrom ..platform.timeutil import iso, parse\n\nlog = get_logger(\"followup.ingestion\")\n\nKNOWN_TYPES = {\"quote_sent\", \"quote_viewed\", \"customer_replied\", \"message_sent\", \"quote_accepted\"}\nCLOSED = {\"accepted\", \"dismissed\"}\n\n\n@dataclass\nclass IngestReport:\n    received: int = 0\n    stored: int = 0\n    duplicates: int = 0\n    malformed: list[dict[str, Any]] = field(default_factory=list)\n    unknown_types: list[str] = field(default_factory=list)\n    unknown_quotes: list[str] = field(default_factory=list)\n\n    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n\n\ndef normalise_phone(raw: str) -> str:\n    digits = re.sub(r\"\\D\", \"\", raw or \"\")\n    if not digits:\n        raise ValueError(\"phone number has no digits\")\n    if len(digits) == 10:\n        digits = \"1\" + digits\n    return \"+\" + digits\n\n\ndef load_quotes(session: ShopSession, quotes: Iterable[dict[str, Any]]) -> int:\n    \"\"\"Load or refresh quotes. A closed quote never reopens.\"\"\"\n    count = 0\n    with session.tx():\n        for q in quotes:\n            phone = normalise_phone(q[\"customer_phone\"])\n            customer_id = \"C-\" + phone.lstrip(\"+\")\n            session.run(\n                \"INSERT INTO customers (shop_id, id, phone_e164, name) VALUES (:shop_id, :id, :phone, :name) \"\n                \"ON CONFLICT DO NOTHING\",\n                id=customer_id, phone=phone, name=q[\"customer_name\"],\n            )\n            status = q.get(\"status\", \"open\")\n            if status not in CLOSED and status != \"open\":\n                status = \"open\"\n            created = iso(parse(q[\"created_at\"]))\n            last_contact = iso(parse(q[\"last_contact_at\"])) if q.get(\"last_contact_at\") else None\n            inserted = session.run(\n                \"INSERT INTO quotes (shop_id, id, customer_id, tech_name, amount_cents, status, created_at, last_contact_at) \"\n                \"VALUES (:shop_id, :id, :customer_id, :tech, :amount, :status, :created, :last_contact) \"\n                \"ON CONFLICT DO NOTHING\",\n                id=q[\"id\"], customer_id=customer_id, tech=q.get(\"tech_name\", \"\"),\n                amount=int(round(float(q[\"amount\"]) * 100)), status=status,\n                created=created, last_contact=last_contact,\n            )\n            if not inserted:\n                # Refresh. Status only ever moves from open to closed.\n                session.run(\n                    \"UPDATE quotes SET last_contact_at = :last_contact, \"\n                    \"status = CASE WHEN status = 'open' THEN :status ELSE status END \"\n                    \"WHERE shop_id = :shop_id AND id = :id\",\n                    id=q[\"id\"], status=status, last_contact=last_contact,\n                )\n            count += 1\n    return count\n\n\ndef _normalise(payload: dict[str, Any]) -> dict[str, Any]:\n    event_id = payload.get(\"event_id\")\n    etype = payload.get(\"type\")\n    stamp = payload.get(\"timestamp\")\n    if not event_id or not isinstance(event_id, str):\n        raise ValueError(\"missing event_id\")\n    if not etype or not isinstance(etype, str):\n        raise ValueError(\"missing type\")\n    if not stamp:\n        raise ValueError(\"missing timestamp\")\n    return {\n        \"event_id\": event_id,\n        \"quote_id\": payload.get(\"quote_id\"),\n        \"type\": etype,\n        \"occurred_at\": iso(parse(stamp)),\n        \"channel\": payload.get(\"channel\"),\n        \"direction\": payload.get(\"direction\"),\n        # The shop comes from the session, never from the payload.\n        \"raw\": {k: v for k, v in payload.items() if k != \"shop_id\"},\n    }\n\n\ndef ingest_events(session: ShopSession, payloads: Iterable[Any]) -> IngestReport:\n    report = IngestReport()\n    with session.tx():\n        known_quotes = {r[\"id\"] for r in session.rows(\"SELECT id FROM quotes WHERE shop_id = :shop_id\")}\n        for index, payload in enumerate(payloads, start=1):\n            report.received += 1\n            try:\n                if not isinstance(payload, dict):\n                    raise ValueError(\"event is not an object\")\n                event = _normalise(payload)\n            except (ValueError, TypeError) as exc:\n                report.malformed.append({\"line\": index, \"error\": str(exc)})\n                log.warning(\"skipped malformed event at line %s: %s\", index, exc)\n                continue\n            if eventlog.append(session, event):\n                report.stored += 1\n                if event[\"type\"] not in KNOWN_TYPES and event[\"type\"] not in report.unknown_types:\n                    report.unknown_types.append(event[\"type\"])\n                if event[\"quote_id\"] not in known_quotes and event[\"quote_id\"] not in report.unknown_quotes:\n                    report.unknown_quotes.append(str(event[\"quote_id\"]))\n            else:\n                report.duplicates += 1\n    return report\n\n\ndef ingest_lines(session: ShopSession, lines: Iterable[str]) -> IngestReport:\n    \"\"\"Ingest JSON lines. One bad line does not stop the load.\"\"\"\n    payloads: list[Any] = []\n    for line in lines:\n        text = line.strip()\n        if not text:\n            continue\n        try:\n            payloads.append(json.loads(text))\n        except json.JSONDecodeError:\n            payloads.append(None)  # reported as malformed with its position\n    return ingest_events(session, payloads)\n", "followup/learning/__init__.py": "\"\"\"Learning system. Only the decision log is built. The model is designed in docs/DESIGN.md.\"\"\"\nfrom .decision_log import record, read\n\n__all__ = [\"record\", \"read\"]\n", "followup/learning/decision_log.py": "\"\"\"Decision log.\n\nEach draft records the signals and baselines the policy saw, and the action it chose.\nOutcomes are joined later. Without this a learning system has nothing to learn from,\nand a past decision cannot be explained.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport uuid\nfrom datetime import datetime\nfrom typing import Any\n\nfrom .. import POLICY_VERSION\nfrom ..platform.db import ShopSession\nfrom ..platform.timeutil import iso\n\n\ndef record(session: ShopSession, draft_id: str, quote_id: str, now: datetime, signals: dict[str, Any],\n           baselines: dict[str, Any], action: dict[str, Any]) -> None:\n    session.run(\n        \"INSERT INTO decisions (shop_id, id, draft_id, quote_id, decided_at, signals_json, baselines_json, \"\n        \"action_json, policy_version) VALUES (:shop_id, :id, :draft_id, :quote_id, :at, :signals, :baselines, \"\n        \":action, :pv)\",\n        id=\"L-\" + uuid.uuid4().hex[:10], draft_id=draft_id, quote_id=quote_id, at=iso(now),\n        signals=json.dumps(signals, sort_keys=True), baselines=json.dumps(baselines, sort_keys=True),\n        action=json.dumps(action, sort_keys=True), pv=POLICY_VERSION,\n    )\n\n\ndef read(session: ShopSession) -> list[dict[str, Any]]:\n    return session.rows(\"SELECT * FROM decisions WHERE shop_id = :shop_id ORDER BY decided_at, id\")\n", "followup/platform/__init__.py": "\"\"\"Shared pieces that stand in for the larger platform: config, database access, event log.\"\"\"\n", "followup/platform/config.py": "\"\"\"Per shop configuration.\n\nTwo kinds of numbers live here and they are kept apart on purpose.\n\nLimits are promises a shop makes (cooldown, attempt cap, caps on offers). They are\nfixed values and never derived from data.\n\nMultipliers turn a shop's own medians into thresholds (see policy/thresholds.py).\nThey are shared by all shops. The scale comes from each shop's data.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field, replace\n\n\n@dataclass(frozen=True)\nclass AddOn:\n    \"\"\"A real, sellable add-on used for the premium option framing.\"\"\"\n    id: str\n    label: str\n    price_cents: int\n    bundle_saving_cents: int = 0\n    job_types: tuple[str, ...] = ()  # empty means it fits any job\n\n\n# Starting values used only when neither the shop nor its parent has enough history.\nPLATFORM_BASELINES: dict[str, float] = {\n    \"amount\": 500000.0,        # cents\n    \"first_view\": 48.0,        # hours\n    \"first_contact\": 48.0,     # hours\n    \"view_gap\": 48.0,          # hours\n    \"view_to_reply\": 12.0,     # hours\n    \"time_to_accept\": 168.0,   # hours, 7 days\n    \"utilisation\": 0.8,        # share of available hours booked\n}\n\n\n@dataclass(frozen=True)\nclass ShopConfig:\n    shop_name: str = \"the shop\"\n    utc_offset_hours: int = -4  # a zone database is the production answer\n\n    # Limits. Fixed promises, not statistics.\n    cooldown_hours: float = 72.0\n    attempt_cap: int = 3\n    fresh_hold_hours: float = 24.0\n    live_conversation_hold_hours: float = 48.0\n    quiet_hours_enabled: bool = True\n    quiet_start_hour: int = 9\n    quiet_end_hour: int = 20\n    daily_send_cap: int = 50\n\n    # Baselines.\n    min_samples: int = 15\n    baseline_window_days: int = 90\n\n    # Multipliers applied to the shop's medians.\n    big_multiple: float = 2.0\n    burst_views: int = 3\n    returned_gap_multiple: float = 2.0\n    big_quiet_fraction: float = 0.5\n\n    # Offers. The engine never invents a number, it reads these.\n    hold_days: int = 7\n    percent_off_enabled: bool = True\n    percent_base: float = 0.03\n    percent_max: float = 0.06\n    percent_cap_cents: int = 100000\n    monthly_offer_budget_cents: int = 400000\n    slack_curve_mid: float = 0.5        # slack where the offer rises fastest\n    slack_curve_steepness: float = 8.0  # 0 is a straight line; higher is a sharper S\n    nearby_step: float = 0.5           # a nearby opening counts as this much extra slack\n    early_offer_slack: float = 0.5     # slack at which a costed offer may come one touch early\n    capacity_pricing_enabled: bool = True\n\n    # Premium option framing.\n    addons: tuple[AddOn, ...] = ()\n    premium_min_ratio: float = 1.2\n    premium_max_ratio: float = 1.5\n\n    # Text rules.\n    blocked_words: tuple[str, ...] = (\"guaranteed\", \"guarantee\", \"free\", \"promise\")\n    max_body_chars: int = 320\n    tone: str = \"friendly and brief\"\n\n    def with_(self, **changes) -> \"ShopConfig\":\n        return replace(self, **changes)\n\n\ndef demo_config() -> ShopConfig:\n    \"\"\"Config for the seed shop. The offer and add-on values are our assumptions.\"\"\"\n    return ShopConfig(\n        shop_name=\"Robby Home Services\",\n        addons=(\n            AddOn(id=\"plan2\", label=\"2 year service plan\", price_cents=120000),\n            AddOn(id=\"plan5\", label=\"5 year service plan\", price_cents=350000),\n            AddOn(id=\"upgrade\", label=\"high efficiency upgrade and 10 year warranty\", price_cents=650000),\n        ),\n    )\n", "followup/platform/db.py": "\"\"\"Database access.\n\nShopSession is the only way the engine reaches the database. It is created for one\nshop and refuses any statement that does not filter on :shop_id. On Postgres it also\nsets the shop for the transaction so row level security can enforce the same thing\nin the database.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nfrom contextlib import contextmanager\nfrom pathlib import Path\nfrom typing import Any, Iterator\n\nfrom sqlalchemy import create_engine, event, text\nfrom sqlalchemy.engine import Engine\nfrom sqlalchemy.pool import StaticPool\n\nSCHEMA_PATH = Path(__file__).resolve().parents[2] / \"db\" / \"schema.sql\"\nRLS_PATH = Path(__file__).resolve().parents[2] / \"db\" / \"rls_postgres.sql\"\n\n\nclass TenantScopeError(RuntimeError):\n    \"\"\"Raised when a statement is not scoped to a shop.\"\"\"\n\n\ndef make_engine(url: str | None = None, role: str | None = None) -> Engine:\n    \"\"\"Create an engine. Default is SQLite in memory. DATABASE_URL selects another.\"\"\"\n    url = url or os.environ.get(\"DATABASE_URL\") or \"sqlite://\"\n    if url.startswith(\"sqlite\"):\n        kwargs: dict[str, Any] = {\"connect_args\": {\"check_same_thread\": False}}\n        if url in (\"sqlite://\", \"sqlite:///:memory:\"):\n            kwargs[\"poolclass\"] = StaticPool\n        engine = create_engine(url, **kwargs)\n\n        @event.listens_for(engine, \"connect\")\n        def _on_connect(dbapi_conn, _record):  # pragma: no cover - wiring\n            # Take over transaction control so BEGIN IMMEDIATE below is honoured.\n            dbapi_conn.isolation_level = None\n            cur = dbapi_conn.cursor()\n            cur.execute(\"PRAGMA foreign_keys=ON\")\n            cur.execute(\"PRAGMA busy_timeout=5000\")\n            cur.close()\n\n        @event.listens_for(engine, \"begin\")\n        def _on_begin(conn):  # pragma: no cover - wiring\n            # One writer at a time. The send claim relies on this on SQLite.\n            conn.exec_driver_sql(\"BEGIN IMMEDIATE\")\n\n        return engine\n\n    engine = create_engine(url)\n    role = role or os.environ.get(\"FOLLOWUP_DB_ROLE\")\n    if role:\n        if not role.replace(\"_\", \"\").isalnum():\n            raise ValueError(\"database role must be a plain identifier\")\n\n        @event.listens_for(engine, \"connect\")\n        def _set_role(dbapi_conn, _record):  # pragma: no cover - Postgres only\n            # Drop to the application role, which row level security applies to.\n            cur = dbapi_conn.cursor()\n            cur.execute(f'SET ROLE \"{role}\"')\n            cur.close()\n            dbapi_conn.commit()\n\n    return engine\n\n\ndef apply_rls(engine: Engine) -> None:\n    \"\"\"Postgres only. Create the application role and the row level security policies.\"\"\"\n    # Sent through the raw driver cursor with no parameters. Through exec_driver_sql the\n    # driver reads format()'s %I as a placeholder and the script never runs.\n    with engine.begin() as conn:\n        cursor = conn.connection.driver_connection.cursor()\n        cursor.execute(RLS_PATH.read_text(encoding=\"utf-8\"))\n        cursor.close()\n\n\ndef apply_schema(engine: Engine, schema_sql: str | None = None) -> None:\n    sql = schema_sql if schema_sql is not None else SCHEMA_PATH.read_text(encoding=\"utf-8\")\n    statements = [s.strip() for s in _strip_comments(sql).split(\";\") if s.strip()]\n    with engine.begin() as conn:\n        for stmt in statements:\n            conn.execute(text(stmt))\n\n\ndef _strip_comments(sql: str) -> str:\n    return \"\\n\".join(line for line in sql.splitlines() if not line.strip().startswith(\"--\"))\n\n\ndef is_postgres(engine: Engine) -> bool:\n    return engine.dialect.name == \"postgresql\"\n\n\nclass ShopSession:\n    \"\"\"All reads and writes for one shop.\"\"\"\n\n    def __init__(self, engine: Engine, shop_id: str):\n        if not shop_id or not isinstance(shop_id, str):\n            raise TenantScopeError(\"a shop id is required\")\n        self.engine = engine\n        self.shop_id = shop_id\n        self._conn = None\n\n    @contextmanager\n    def tx(self) -> Iterator[\"ShopSession\"]:\n        \"\"\"One transaction. Nested calls join the outer one.\"\"\"\n        if self._conn is not None:\n            yield self\n            return\n        with self.engine.begin() as conn:\n            self._conn = conn\n            try:\n                if is_postgres(self.engine):\n                    conn.execute(text(\"SELECT set_config('app.shop_id', :s, true)\"), {\"s\": self.shop_id})\n                yield self\n            finally:\n                self._conn = None\n\n    def _check(self, sql: str) -> None:\n        if \":shop_id\" not in sql:\n            raise TenantScopeError(\"statement is not scoped to a shop: \" + sql.strip()[:80])\n\n    def rows(self, sql: str, **params: Any) -> list[dict[str, Any]]:\n        self._check(sql)\n        params[\"shop_id\"] = self.shop_id\n        with self.tx():\n            result = self._conn.execute(text(sql), params)\n            return [dict(r._mapping) for r in result]\n\n    def one(self, sql: str, **params: Any) -> dict[str, Any] | None:\n        found = self.rows(sql, **params)\n        return found[0] if found else None\n\n    def run(self, sql: str, **params: Any) -> int:\n        \"\"\"Execute a write. Returns the number of rows changed.\"\"\"\n        self._check(sql)\n        params[\"shop_id\"] = self.shop_id\n        with self.tx():\n            return self._conn.execute(text(sql), params).rowcount\n\n\ndef ensure_shop(engine: Engine, shop_id: str, org_id: str = \"org-1\", name: str | None = None) -> None:\n    \"\"\"Platform level setup, outside any shop session.\"\"\"\n    with engine.begin() as conn:\n        if is_postgres(engine):\n            conn.execute(text(\"SELECT set_config('app.shop_id', :s, true)\"), {\"s\": shop_id})\n        conn.execute(\n            text(\n                \"INSERT INTO shops (shop_id, org_id, name) VALUES (:s, :o, :n) \"\n                \"ON CONFLICT DO NOTHING\"\n            ),\n            {\"s\": shop_id, \"o\": org_id, \"n\": name or shop_id},\n        )\n", "followup/platform/eventlog.py": "\"\"\"The event log. Append only. The primary key makes a duplicate append a no-op.\"\"\"\nfrom __future__ import annotations\n\nimport json\nfrom typing import Any\n\nfrom .db import ShopSession\n\n\ndef append(session: ShopSession, event: dict[str, Any]) -> bool:\n    \"\"\"Append one normalised event. Returns False if that event id was already stored.\"\"\"\n    changed = session.run(\n        \"INSERT INTO events (shop_id, event_id, quote_id, type, occurred_at, channel, direction, raw_json) \"\n        \"VALUES (:shop_id, :event_id, :quote_id, :type, :occurred_at, :channel, :direction, :raw_json) \"\n        \"ON CONFLICT DO NOTHING\",\n        event_id=event[\"event_id\"],\n        quote_id=event.get(\"quote_id\"),\n        type=event[\"type\"],\n        occurred_at=event[\"occurred_at\"],\n        channel=event.get(\"channel\"),\n        direction=event.get(\"direction\"),\n        raw_json=json.dumps(event.get(\"raw\", event), sort_keys=True),\n    )\n    return changed == 1\n\n\ndef read(session: ShopSession) -> list[dict[str, Any]]:\n    return session.rows(\n        \"SELECT event_id, quote_id, type, occurred_at, channel, direction FROM events \"\n        \"WHERE shop_id = :shop_id ORDER BY occurred_at, event_id\"\n    )\n", "followup/platform/redact.py": "\"\"\"Masks phone numbers before anything is logged.\"\"\"\nfrom __future__ import annotations\n\nimport logging\nimport re\n\n_PHONE = re.compile(r\"\\+?\\d[\\d\\-\\s().]{7,}\\d\")\n\n\ndef mask_phone(text: str) -> str:\n    def _mask(match: re.Match) -> str:\n        digits = re.sub(r\"\\D\", \"\", match.group(0))\n        return \"***\" + digits[-2:]\n\n    return _PHONE.sub(_mask, text)\n\n\nclass RedactingFilter(logging.Filter):\n    def filter(self, record: logging.LogRecord) -> bool:\n        record.msg = mask_phone(record.getMessage())\n        record.args = ()\n        return True\n\n\ndef get_logger(name: str = \"followup\") -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not any(isinstance(f, RedactingFilter) for f in logger.filters):\n        logger.addFilter(RedactingFilter())\n    return logger\n", "followup/platform/timeutil.py": "\"\"\"Time helpers. All stored times are UTC text like 2026-08-16T16:00:00Z.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import datetime, timedelta, timezone\n\nUTC = timezone.utc\n\n\ndef parse(value: str | datetime) -> datetime:\n    \"\"\"Parse an ISO timestamp to an aware UTC datetime. Naive input is taken as UTC.\"\"\"\n    if isinstance(value, datetime):\n        dt = value\n    else:\n        text = value.strip()\n        if text.endswith((\"Z\", \"z\")):\n            text = text[:-1] + \"+00:00\"\n        dt = datetime.fromisoformat(text)\n    if dt.tzinfo is None:\n        dt = dt.replace(tzinfo=UTC)\n    return dt.astimezone(UTC)\n\n\ndef iso(dt: datetime) -> str:\n    return dt.astimezone(UTC).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n\n\ndef hours_between(earlier: datetime, later: datetime) -> float:\n    return (later - earlier).total_seconds() / 3600.0\n\n\ndef add_hours(dt: datetime, hours: float) -> datetime:\n    return dt + timedelta(hours=hours)\n", "followup/policy/__init__.py": "\"\"\"Policy engine: who to contact, why, with what strategy, framing and offer. Pure.\"\"\"\nfrom .engine import Candidate, CustomerFacts, Excluded, PolicyResult, QuoteFacts, evaluate\nfrom .thresholds import Thresholds, build_thresholds\n\n__all__ = [\"Candidate\", \"CustomerFacts\", \"Excluded\", \"PolicyResult\", \"QuoteFacts\", \"evaluate\",\n           \"Thresholds\", \"build_thresholds\"]\n", "followup/policy/engine.py": "\"\"\"Filters, tiers and ranking.\n\nPure. Takes state, signals, thresholds, a few facts from the workflow tables and a\ncapacity snapshot. Returns candidates and, just as usefully, who was excluded and why.\n\n`path` on each result records the questions asked and the answers, in the order of\nthe flowchart in docs/DESIGN.md section 9. The page uses it to light the diagram.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import datetime\nfrom typing import Mapping\n\nfrom ..capacity.base import CapacitySnapshot\nfrom ..platform.config import ShopConfig\nfrom ..platform.timeutil import hours_between\nfrom ..state.projector import QuoteState\nfrom ..state.signals import Signals\nfrom .offers import choose_strategy, decide_close\nfrom .thresholds import Thresholds\n\nTIER_CODES = {1: \"awaiting_reply\", 2: \"hot_view\", 3: \"big_quiet\", 4: \"first_followup\", 5: \"stale\"}\n\n\n@dataclass(frozen=True)\nclass QuoteFacts:\n    \"\"\"What the workflow tables know about a quote.\"\"\"\n    snoozed_until: datetime | None = None\n    had_costed_offer: bool = False\n    prior_framings: frozenset[str] = frozenset()\n\n\n@dataclass(frozen=True)\nclass CustomerFacts:\n    has_live_draft: bool = False\n\n\n@dataclass\nclass Candidate:\n    quote_id: str\n    customer_id: str\n    customer_name: str\n    tech_name: str\n    amount_cents: int\n    tier: int\n    reason_code: str\n    reason: str\n    strategy: str\n    framing: dict | None\n    offer: dict | None\n    approver_note: str\n    requires_owner: bool\n    signals: dict\n    path: list[list[str]]\n    rank: int = 0\n\n    def to_dict(self) -> dict:\n        return dict(self.__dict__)\n\n\n@dataclass\nclass Excluded:\n    quote_id: str\n    customer_id: str\n    customer_name: str\n    amount_cents: int\n    why: str\n    detail: str\n    path: list[list[str]]\n    manual_lead: bool = False\n\n    def to_dict(self) -> dict:\n        return dict(self.__dict__)\n\n\n@dataclass\nclass PolicyResult:\n    candidates: list[Candidate] = field(default_factory=list)\n    excluded: list[Excluded] = field(default_factory=list)\n\n\ndef _ago(hours: float) -> str:\n    if hours < 48:\n        return f\"{hours:.0f} hours\"\n    return f\"{hours / 24:.1f} days\"\n\n\ndef _tier(sig: Signals, big: bool, th: Thresholds, path: list[list[str]]) -> tuple[int | None, str]:\n    \"\"\"Walk the tier questions. Returns the tier, or None with the reason.\"\"\"\n    path.append([\"T1\", \"yes\" if sig.awaiting_our_reply else \"no\"])\n    if sig.awaiting_our_reply:\n        return 1, \"\"\n    path.append([\"T2\", \"yes\" if sig.viewed_since_contact else \"no\"])\n    if sig.viewed_since_contact:\n        return 2, \"\"\n    attempts = sig.unanswered_attempts\n    served = attempts == 0 or sig.hours_since_contact >= th.backoff_h(attempts)\n    path.append([\"BK\", \"yes\" if served else \"no\"])\n    if not served:\n        return None, (f\"backoff: {attempts} unanswered, waiting {_ago(th.backoff_h(attempts))}, \"\n                      f\"{_ago(sig.hours_since_contact)} served\")\n    t3 = big and sig.hours_since_contact >= th.big_quiet_h\n    path.append([\"T3\", \"yes\" if t3 else \"no\"])\n    if t3:\n        return 3, \"\"\n    t4 = sig.never_contacted and sig.age_hours >= th.first_followup_h\n    path.append([\"T4\", \"yes\" if t4 else \"no\"])\n    if t4:\n        return 4, \"\"\n    t5 = sig.hours_since_contact >= th.stale_h\n    path.append([\"T5\", \"yes\" if t5 else \"no\"])\n    if t5:\n        return 5, \"\"\n    return None, \"not due yet\"\n\n\ndef _reason(tier: int, s: QuoteState, sig: Signals, th: Thresholds, now: datetime) -> str:\n    ratio = f\"{sig.amount_ratio:.1f} times the shop's typical quote\"\n    if tier == 1:\n        waited = _ago(hours_between(s.last_reply, now))\n        channel = f\" by {sig.reply_channel}\" if sig.reply_channel else \"\"\n        return f\"Customer replied{channel} {waited} ago and nobody has answered.\"\n    if tier == 2:\n        seen = _ago(hours_between(s.last_view, now))\n        parts = [f\"Viewed {sig.views_since_contact} time{'s' if sig.views_since_contact != 1 else ''} \"\n                 f\"since our last contact, most recently {seen} ago.\"]\n        if sig.view_burst:\n            parts.append(f\"{th.burst_views} or more views inside one typical gap ({_ago(th.burst_window_h)}).\")\n        if sig.returned_after_gap:\n            parts.append(\"Came back after a long silence.\")\n        parts.append(f\"Quote is {ratio}.\")\n        return \" \".join(parts)\n    if tier == 3:\n        text = f\"Big quote, {ratio}, with no contact for {_ago(sig.hours_since_contact)}.\"\n        if sig.views_since_contact:\n            text += f\" Viewed {sig.views_since_contact} time{'s' if sig.views_since_contact != 1 else ''} since.\"\n        return text\n    if tier == 4:\n        return (f\"Never contacted and {_ago(sig.age_hours)} old. \"\n                f\"This shop usually makes first contact within {_ago(th.first_followup_h)}.\")\n    return (f\"No contact for {_ago(sig.hours_since_contact)}. \"\n            f\"Quotes here usually close within {_ago(th.stale_h)}.\")\n\n\ndef evaluate(\n    states: Mapping[str, QuoteState],\n    signals: Mapping[str, Signals],\n    th: Thresholds,\n    config: ShopConfig,\n    now: datetime,\n    quote_facts: Mapping[str, QuoteFacts] | None = None,\n    customer_facts: Mapping[str, CustomerFacts] | None = None,\n    capacity: CapacitySnapshot | None = None,\n    budget_spent_cents: int = 0,\n) -> PolicyResult:\n    quote_facts = quote_facts or {}\n    customer_facts = customer_facts or {}\n    capacity = capacity or CapacitySnapshot()\n    result = PolicyResult()\n\n    # Customer level contact facts span all of a customer's quotes, open or closed.\n    last_contact: dict[str, datetime] = {}\n    last_reply: dict[str, datetime] = {}\n    for s in states.values():\n        if s.last_contact and s.last_contact > last_contact.get(s.customer_id, datetime.min.replace(tzinfo=now.tzinfo)):\n            last_contact[s.customer_id] = s.last_contact\n        if s.last_reply and s.last_reply > last_reply.get(s.customer_id, datetime.min.replace(tzinfo=now.tzinfo)):\n            last_reply[s.customer_id] = s.last_reply\n\n    def exclude(s: QuoteState, why: str, detail: str, path, manual_lead: bool = False) -> None:\n        result.excluded.append(Excluded(s.quote_id, s.customer_id, s.customer_name, s.amount_cents,\n                                        why, detail, path, manual_lead))\n\n    eligible: list[tuple[tuple, QuoteState, Signals, int, list]] = []\n    for qid in sorted(states):\n        s = states[qid]\n        sig = signals[qid]\n        facts = quote_facts.get(qid, QuoteFacts())\n        path: list[list[str]] = []\n        big = s.amount_cents >= th.big_amount_cents\n\n        # Question B: closed, held, or attempts exhausted.\n        if s.closed:\n            path.append([\"B\", \"yes\"])\n            revisited = bool(s.last_view) and hours_between(s.last_view, now) <= th.hot_window_h\n            exclude(s, \"closed\", f\"quote is {s.status}\" + (\", viewed again recently\" if revisited else \"\"),\n                    path, manual_lead=revisited and s.status == \"dismissed\")\n            continue\n        if sig.hold:\n            path.append([\"B\", \"yes\"])\n            detail = \"quote is less than a day old\" if sig.hold == \"fresh\" else \"we answered their reply recently\"\n            exclude(s, \"hold_\" + sig.hold, detail, path)\n            continue\n        if facts.snoozed_until and facts.snoozed_until > now:\n            path.append([\"B\", \"yes\"])\n            exclude(s, \"snoozed\", \"a draft was rejected recently\", path)\n            continue\n        if sig.unanswered_attempts >= config.attempt_cap and not sig.awaiting_our_reply:\n            path.append([\"B\", \"yes\"])\n            exclude(s, \"gone_quiet\", f\"{sig.unanswered_attempts} unanswered messages, listed for the owner\", path)\n            continue\n        path.append([\"B\", \"no\"])\n\n        # Question C: customer cooldown or a live draft.\n        c_contact = last_contact.get(s.customer_id)\n        c_reply = last_reply.get(s.customer_id)\n        replied_since = c_reply is not None and (c_contact is None or c_reply > c_contact)\n        in_cooldown = (\n            c_contact is not None\n            and hours_between(c_contact, now) < config.cooldown_hours\n            and not replied_since   # a reply clears the cooldown\n        )\n        if in_cooldown:\n            path.append([\"C\", \"yes\"])\n            exclude(s, \"cooldown\", f\"customer contacted {_ago(hours_between(c_contact, now))} ago\", path)\n            continue\n        if customer_facts.get(s.customer_id, CustomerFacts()).has_live_draft:\n            path.append([\"C\", \"yes\"])\n            exclude(s, \"live_draft\", \"customer already has a draft in review\", path)\n            continue\n        path.append([\"C\", \"no\"])\n\n        tier, why_not = _tier(sig, big, th, path)\n        if tier is None:\n            exclude(s, why_not.split(\":\")[0].replace(\" \", \"_\"), why_not, path)\n            continue\n\n        deprioritised = capacity.fully_booked and not big and tier >= 3\n        latest = max([t for t in (s.last_view, s.last_reply, s.last_contact, s.created_at) if t])\n        key = (tier, deprioritised, not sig.view_burst, -sig.amount_ratio, -latest.timestamp(), qid)\n        eligible.append((key, s, sig, tier, path))\n\n    # One candidate per customer. The best tier wins.\n    eligible.sort(key=lambda item: item[0])\n    chosen: set[str] = set()\n    budget_left = max(0, config.monthly_offer_budget_cents - budget_spent_cents)\n    for key, s, sig, tier, path in eligible:\n        if s.customer_id in chosen:\n            path.append([\"M\", \"other\"])\n            exclude(s, \"other_quote_chosen\", \"the customer's other quote ranked higher\", path)\n            continue\n        chosen.add(s.customer_id)\n        path.append([\"M\", \"chosen\"])\n        facts = quote_facts.get(s.quote_id, QuoteFacts())\n        big = s.amount_cents >= th.big_amount_cents\n        strategy = choose_strategy(tier, sig, big, bool(s.views))\n\n        framing = offer = None\n        note = \"\"\n        if strategy == \"reply\":\n            note = \"Needs a human reply. We do not know what the customer said. Edit before approving.\"\n        elif strategy == \"close\":\n            decision = decide_close(\n                s.amount_cents, sig.unanswered_attempts, s.customer_id, facts.had_costed_offer,\n                facts.prior_framings, capacity, budget_left, config, now,\n            )\n            framing, offer, note = decision.framing.to_dict(), decision.offer, decision.note\n            if offer is not None and offer.costed:\n                budget_left -= offer.value_cents\n\n        result.candidates.append(Candidate(\n            quote_id=s.quote_id, customer_id=s.customer_id, customer_name=s.customer_name,\n            tech_name=s.tech_name, amount_cents=s.amount_cents, tier=tier,\n            reason_code=TIER_CODES[tier], reason=_reason(tier, s, sig, th, now),\n            strategy=strategy, framing=framing, offer=offer.to_dict() if offer else None,\n            approver_note=note, requires_owner=bool(offer and offer.costed),\n            signals=sig.to_dict(), path=path, rank=len(result.candidates) + 1,\n        ))\n    return result\n", "followup/policy/framing.py": "\"\"\"Price anchoring.\n\nA framing changes how the price reads without changing it. Every number in a framing\ncomes from the quote, an offer or the shop's catalogue. A framing whose data is\nmissing is never chosen and never approximated.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nfrom ..platform.config import AddOn, ShopConfig\n\n\n@dataclass(frozen=True)\nclass Framing:\n    kind: str                                  # price_hold, was_now, premium_option\n    numbers_cents: dict[str, int] = field(default_factory=dict)\n    addon_id: str | None = None\n    addon_label: str | None = None\n\n    def to_dict(self) -> dict:\n        return {\"kind\": self.kind, \"numbers_cents\": dict(self.numbers_cents),\n                \"addon_id\": self.addon_id, \"addon_label\": self.addon_label}\n\n\ndef package_price(amount_cents: int, addon: AddOn) -> int:\n    return amount_cents + addon.price_cents - addon.bundle_saving_cents\n\n\ndef choose_premium(amount_cents: int, config: ShopConfig, job_type: str | None = None) -> AddOn | None:\n    \"\"\"Pick the add-on whose package lands in the anchoring range, nearest its middle.\n\n    Too close to the quote and it does not anchor. Too far and it is ignored.\n    \"\"\"\n    if amount_cents <= 0:\n        return None\n    middle = (config.premium_min_ratio + config.premium_max_ratio) / 2\n    best: tuple[float, AddOn] | None = None\n    for addon in config.addons:\n        if addon.job_types and job_type not in addon.job_types:\n            continue\n        ratio = package_price(amount_cents, addon) / amount_cents\n        if config.premium_min_ratio <= ratio <= config.premium_max_ratio:\n            distance = abs(ratio - middle)\n            if best is None or distance < best[0]:\n                best = (distance, addon)\n    return best[1] if best else None\n\n\ndef premium_framing(amount_cents: int, addon: AddOn) -> Framing:\n    numbers = {\"quote\": amount_cents, \"package\": package_price(amount_cents, addon), \"addon\": addon.price_cents}\n    if addon.bundle_saving_cents:\n        numbers[\"bundle_saving\"] = addon.bundle_saving_cents\n    return Framing(\"premium_option\", numbers, addon.id, addon.label)\n\n\ndef price_hold_framing(amount_cents: int) -> Framing:\n    return Framing(\"price_hold\", {\"quote\": amount_cents})\n\n\ndef was_now_framing(amount_cents: int, off_cents: int) -> Framing:\n    return Framing(\"was_now\", {\"quote\": amount_cents, \"off\": off_cents, \"now\": amount_cents - off_cents})\n", "followup/policy/offers.py": "\"\"\"Strategy ladder and offer choice.\n\nThe engine never invents a number. Offer sizes come from the shop's config, scale\nwith capacity, and are clamped by the shop's cap and monthly budget.\n\"\"\"\nfrom __future__ import annotations\n\nimport math\n\nfrom dataclasses import dataclass\nfrom datetime import datetime, timedelta\n\nfrom ..capacity.base import CapacitySnapshot, Opening\nfrom ..platform.config import ShopConfig\nfrom ..platform.timeutil import iso, parse\nfrom ..state.signals import Signals\nfrom .framing import Framing, choose_premium, premium_framing, price_hold_framing, was_now_framing\n\nROUND_TO_CENTS = 2500  # offers are quoted in steps of $25\n\n\n@dataclass(frozen=True)\nclass Offer:\n    kind: str                    # price_hold, percent_off\n    value_cents: int\n    expires_at: str\n    slot_ref: str | None = None\n    slot_label: str | None = None\n    percent: float | None = None\n\n    @property\n    def costed(self) -> bool:\n        return self.value_cents > 0\n\n    def to_dict(self) -> dict:\n        return {\"kind\": self.kind, \"value_cents\": self.value_cents, \"expires_at\": self.expires_at,\n                \"slot_ref\": self.slot_ref, \"slot_label\": self.slot_label,\n                \"percent\": round(self.percent, 4) if self.percent is not None else None,\n                \"costed\": self.costed}\n\n\ndef choose_strategy(tier: int, sig: Signals, big: bool, has_views: bool) -> str:\n    if tier == 1:\n        return \"reply\"\n    attempts = sig.unanswered_attempts\n    if sig.never_viewed and attempts < 2:\n        return \"check_delivery\"\n    if attempts == 0:\n        return \"nudge\"\n    if big and has_views:\n        return \"close\"\n    return \"help\"\n\n\ndef effective_slack(snapshot: CapacitySnapshot, opening: Opening | None, config: ShopConfig) -> float:\n    if not config.capacity_pricing_enabled:\n        return 0.0\n    slack = snapshot.shop_slack + (config.nearby_step if opening else 0.0)\n    return max(0.0, min(1.0, slack))\n\n\ndef slack_curve(slack: float, config: ShopConfig) -> float:\n    \"\"\"Logistic response to slack, rescaled so slack 0 maps to 0 and slack 1 maps to 1.\n\n    Near a median week and near an empty week the offer changes little. It changes fastest\n    around slack_curve_mid. Steepness 0 gives a straight line.\n    \"\"\"\n    x = max(0.0, min(1.0, slack))\n    k, mid = config.slack_curve_steepness, config.slack_curve_mid\n    if k <= 0:\n        return x\n    def f(t: float) -> float:\n        return 1.0 / (1.0 + math.exp(-k * (t - mid)))\n    lo, hi = f(0.0), f(1.0)\n    return max(0.0, min(1.0, (f(x) - lo) / (hi - lo)))\n\n\ndef percent_value_cents(amount_cents: int, slack: float, config: ShopConfig) -> tuple[int, float]:\n    \"\"\"Offer size: base to max percent along the slack curve, then the cap, then round down to $25.\"\"\"\n    percent = config.percent_base + (config.percent_max - config.percent_base) * slack_curve(slack, config)\n    value = min(int(amount_cents * percent), config.percent_cap_cents)\n    value = (value // ROUND_TO_CENTS) * ROUND_TO_CENTS\n    return value, percent\n\n\n@dataclass(frozen=True)\nclass CloseDecision:\n    framing: Framing\n    offer: Offer | None\n    note: str\n\n\ndef decide_close(\n    amount_cents: int,\n    attempts: int,\n    customer_id: str,\n    had_costed_offer: bool,\n    prior_framings: frozenset[str],\n    snapshot: CapacitySnapshot,\n    budget_left_cents: int,\n    config: ShopConfig,\n    now: datetime,\n) -> CloseDecision:\n    \"\"\"Pick a framing, and an offer if one is allowed. Free framings come first.\"\"\"\n    hold_until = now + timedelta(days=config.hold_days)\n    opening = snapshot.opening_near(customer_id) if config.capacity_pricing_enabled else None\n    slack = effective_slack(snapshot, opening, config)\n    final_touch = attempts >= config.attempt_cap - 1\n    early = opening is not None or (config.capacity_pricing_enabled and snapshot.shop_slack >= config.early_offer_slack)\n\n    costed_allowed = (\n        config.percent_off_enabled\n        and not snapshot.fully_booked\n        and not had_costed_offer\n        and (final_touch or early)\n    )\n    if costed_allowed:\n        value, percent = percent_value_cents(amount_cents, slack, config)\n        if 0 < value <= budget_left_cents:\n            expires = hold_until\n            if opening is not None:\n                expires = min(expires, parse(opening.ends_at))\n            offer = Offer(\"percent_off\", value, iso(expires), opening.slot_id if opening else None,\n                          opening.label if opening else None, percent)\n            why = \"nearby opening\" if opening else (\"light week\" if early else \"final touch\")\n            return CloseDecision(\n                was_now_framing(amount_cents, value), offer,\n                f\"Costed offer of ${value // 100:,} ({why}). Owner approval required.\",\n            )\n\n    addon = choose_premium(amount_cents, config)\n    if addon is not None and \"premium_option\" not in prior_framings:\n        return CloseDecision(\n            premium_framing(amount_cents, addon), None,\n            f\"Premium option anchor: {addon.label}. It is a real package, sell it if they say yes.\",\n        )\n\n    return CloseDecision(\n        price_hold_framing(amount_cents),\n        Offer(\"price_hold\", 0, iso(hold_until)),\n        \"Price hold, no cost to the shop.\",\n    )\n", "followup/policy/thresholds.py": "\"\"\"Turn a shop's medians into thresholds.\n\nEach threshold is a baseline times a shared multiplier. The table in docs/DESIGN.md\nsection 9 mirrors this file.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import asdict, dataclass\nfrom typing import Mapping\n\nfrom ..platform.config import ShopConfig\nfrom ..state.baselines import Baseline\nfrom ..state.signals import Windows\n\n\n@dataclass(frozen=True)\nclass Thresholds:\n    big_amount_cents: float      # big quote: a multiple of the median amount\n    hot_window_h: float          # a view stays hot for one typical gap between views\n    burst_window_h: float        # several views inside one typical gap is a burst\n    burst_views: int\n    returned_gap_h: float        # silence longer than this, then a view, is a return\n    never_viewed_h: float        # no view by the typical time to a first view\n    first_followup_h: float      # never contacted past the shop's own usual first contact\n    stale_h: float               # no contact for longer than the typical time to accept\n    big_quiet_h: float           # big quotes wait a fraction of the stale time\n    backoff_step_h: float        # extra wait per unanswered attempt\n    cooldown_h: float            # a limit, copied here so one object explains a decision\n\n    def backoff_h(self, attempts: int) -> float:\n        \"\"\"Wait required before the next message after `attempts` unanswered ones.\"\"\"\n        return self.cooldown_h + attempts * self.backoff_step_h\n\n    def to_dict(self) -> dict:\n        d = {k: round(v, 1) if isinstance(v, float) else v for k, v in asdict(self).items()}\n        d[\"backoff_h\"] = [round(self.backoff_h(n), 1) for n in (1, 2)]\n        return d\n\n    def windows(self, config: ShopConfig, median_amount_cents: float) -> Windows:\n        return Windows(\n            hot_window=self.hot_window_h,\n            burst_window=self.burst_window_h,\n            burst_views=self.burst_views,\n            returned_gap=self.returned_gap_h,\n            never_viewed_after=self.never_viewed_h,\n            fresh_hold=config.fresh_hold_hours,\n            live_conversation_hold=config.live_conversation_hold_hours,\n            median_amount_cents=median_amount_cents,\n        )\n\n\ndef build_thresholds(baselines: Mapping[str, Baseline], config: ShopConfig) -> Thresholds:\n    b = {k: v.value for k, v in baselines.items()}\n    return Thresholds(\n        big_amount_cents=config.big_multiple * b[\"amount\"],\n        hot_window_h=b[\"view_gap\"],\n        burst_window_h=b[\"view_gap\"],\n        burst_views=config.burst_views,\n        returned_gap_h=config.returned_gap_multiple * b[\"view_gap\"],\n        never_viewed_h=b[\"first_view\"],\n        first_followup_h=b[\"first_contact\"],\n        stale_h=b[\"time_to_accept\"],\n        big_quiet_h=config.big_quiet_fraction * b[\"time_to_accept\"],\n        backoff_step_h=b[\"view_gap\"],\n        cooldown_h=config.cooldown_hours,\n    )\n", "followup/review/__init__.py": "\"\"\"Review workflow: drafts and the human decisions on them.\"\"\"\nfrom .workflow import (WorkflowError, approve, create_draft, edit, expire_for_closed_quotes, gather_facts,\n                       get_draft, list_drafts, reject)\n\n__all__ = [\"WorkflowError\", \"approve\", \"create_draft\", \"edit\", \"expire_for_closed_quotes\", \"gather_facts\",\n           \"get_draft\", \"list_drafts\", \"reject\"]\n", "followup/review/workflow.py": "\"\"\"Draft lifecycle up to approval.\n\ndraft -> approved | rejected | expired. An edit clears approval. Approval stores a\nhash of the exact text, and only a human can approve.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport uuid\nfrom datetime import datetime, timedelta\nfrom typing import Any\n\nfrom .. import POLICY_VERSION\nfrom ..guard.send_rules import is_human\nfrom ..guard.text_rules import TextContext, body_hash, check_text\nfrom ..platform.db import ShopSession\nfrom ..platform.timeutil import iso, parse\nfrom ..policy.engine import CustomerFacts, QuoteFacts\n\nLIVE = (\"draft\", \"approved\", \"sending\", \"failed\")\nROLES = (\"owner\", \"tech\")\n\n\nclass WorkflowError(Exception):\n    def __init__(self, code: str, message: str):\n        super().__init__(message)\n        self.code = code\n        self.message = message\n\n\ndef _not_found() -> WorkflowError:\n    # Another shop's id reads exactly like a missing id.\n    return WorkflowError(\"not_found\", \"draft not found\")\n\n\ndef get_draft(session: ShopSession, draft_id: str) -> dict[str, Any]:\n    row = session.one(\"SELECT * FROM drafts WHERE shop_id = :shop_id AND id = :id\", id=draft_id)\n    if row is None:\n        raise _not_found()\n    return row\n\n\ndef list_drafts(session: ShopSession) -> list[dict[str, Any]]:\n    drafts = session.rows(\"SELECT * FROM drafts WHERE shop_id = :shop_id ORDER BY created_at, id\")\n    offers = {o[\"draft_id\"]: o for o in session.rows(\"SELECT * FROM offers WHERE shop_id = :shop_id\")}\n    outbox = {o[\"draft_id\"]: o for o in session.rows(\"SELECT * FROM outbox WHERE shop_id = :shop_id\")}\n    for d in drafts:\n        d[\"offer\"] = offers.get(d[\"id\"])\n        d[\"outbox\"] = outbox.get(d[\"id\"])\n    return drafts\n\n\ndef gather_facts(session: ShopSession, now: datetime, cooldown_hours: float\n                 ) -> tuple[dict[str, QuoteFacts], dict[str, CustomerFacts], int]:\n    \"\"\"What the policy needs from the workflow tables.\"\"\"\n    snoozed: dict[str, datetime] = {}\n    framings: dict[str, set[str]] = {}\n    customers: dict[str, CustomerFacts] = {}\n    for d in session.rows(\n        \"SELECT quote_id, customer_id, status, framing, decided_at FROM drafts WHERE shop_id = :shop_id\"\n    ):\n        if d[\"status\"] in LIVE:\n            customers[d[\"customer_id\"]] = CustomerFacts(has_live_draft=True)\n        if d[\"status\"] == \"rejected\" and d[\"decided_at\"]:\n            until = parse(d[\"decided_at\"]) + timedelta(hours=cooldown_hours)\n            if until > snoozed.get(d[\"quote_id\"], until - timedelta(days=1)):\n                snoozed[d[\"quote_id\"]] = until\n        if d[\"status\"] == \"sent\" and d[\"framing\"]:\n            framings.setdefault(d[\"quote_id\"], set()).add(d[\"framing\"])\n\n    costed: set[str] = set()\n    spent = 0\n    month = now.strftime(\"%Y-%m\")\n    for o in session.rows(\n        \"SELECT quote_id, value_cents, status, created_at FROM offers WHERE shop_id = :shop_id AND value_cents > 0\"\n    ):\n        if o[\"status\"] == \"sent\":\n            costed.add(o[\"quote_id\"])\n        if o[\"status\"] in (\"proposed\", \"sent\") and o[\"created_at\"][:7] == month:\n            spent += int(o[\"value_cents\"])\n\n    quote_ids = set(snoozed) | set(framings) | costed\n    quotes = {\n        qid: QuoteFacts(snoozed_until=snoozed.get(qid), had_costed_offer=qid in costed,\n                        prior_framings=frozenset(framings.get(qid, ())))\n        for qid in quote_ids\n    }\n    return quotes, customers, spent\n\n\ndef create_draft(session: ShopSession, cand: dict[str, Any], body: str, written_by: str,\n                 ctx: TextContext, now: datetime) -> str | None:\n    \"\"\"Store a draft. Returns None if the customer already has a live one.\"\"\"\n    draft_id = \"D-\" + uuid.uuid4().hex[:10]\n    framing = cand.get(\"framing\") or {}\n    with session.tx():\n        inserted = session.run(\n            \"INSERT INTO drafts (shop_id, id, quote_id, customer_id, status, tier, reason_code, reason, strategy, \"\n            \"framing, body, written_by, requires_owner, approver_note, created_at, allowed_json, signals_json, \"\n            \"policy_version) VALUES (:shop_id, :id, :quote_id, :customer_id, 'draft', :tier, :reason_code, :reason, \"\n            \":strategy, :framing, :body, :written_by, :requires_owner, :note, :created_at, :allowed, :signals, :pv) \"\n            \"ON CONFLICT DO NOTHING\",\n            id=draft_id, quote_id=cand[\"quote_id\"], customer_id=cand[\"customer_id\"], tier=cand[\"tier\"],\n            reason_code=cand[\"reason_code\"], reason=cand[\"reason\"], strategy=cand[\"strategy\"],\n            framing=framing.get(\"kind\"), body=body, written_by=written_by,\n            requires_owner=1 if cand.get(\"requires_owner\") else 0, note=cand.get(\"approver_note\") or \"\",\n            created_at=iso(now), allowed=json.dumps(ctx.to_dict()), signals=json.dumps(cand.get(\"signals\", {})),\n            pv=POLICY_VERSION,\n        )\n        if not inserted:\n            return None\n        offer = cand.get(\"offer\")\n        if offer:\n            session.run(\n                \"INSERT INTO offers (shop_id, id, draft_id, quote_id, kind, value_cents, expires_at, slot_ref, \"\n                \"status, created_at) VALUES (:shop_id, :id, :draft_id, :quote_id, :kind, :value, :expires, :slot, \"\n                \"'proposed', :created_at)\",\n                id=\"O-\" + uuid.uuid4().hex[:10], draft_id=draft_id, quote_id=cand[\"quote_id\"], kind=offer[\"kind\"],\n                value=int(offer[\"value_cents\"]), expires=offer.get(\"expires_at\"), slot=offer.get(\"slot_ref\"),\n                created_at=iso(now),\n            )\n    return draft_id\n\n\ndef approve(session: ShopSession, draft_id: str, actor: str, role: str, now: datetime) -> dict[str, Any]:\n    if not is_human(actor):\n        raise WorkflowError(\"not_human\", \"only a person can approve a draft\")\n    if role not in ROLES:\n        raise WorkflowError(\"bad_role\", \"role must be owner or tech\")\n    with session.tx():\n        d = get_draft(session, draft_id)\n        if d[\"status\"] != \"draft\":\n            raise WorkflowError(\"bad_state\", f\"draft is {d['status']}, not awaiting approval\")\n        if d[\"requires_owner\"] and role != \"owner\":\n            raise WorkflowError(\"owner_required\", \"a draft with a costed offer needs the owner's approval\")\n        session.run(\n            \"UPDATE drafts SET status = 'approved', approved_body_hash = :h, decided_by = :actor, decided_at = :at, \"\n            \"status_reason = NULL WHERE shop_id = :shop_id AND id = :id AND status = 'draft'\",\n            id=draft_id, h=body_hash(d[\"body\"]), actor=actor, at=iso(now),\n        )\n        return get_draft(session, draft_id)\n\n\ndef edit(session: ShopSession, draft_id: str, body: str, actor: str, now: datetime) -> dict[str, Any]:\n    \"\"\"Change the text. Approval is cleared. Guard findings come back as warnings for the person.\"\"\"\n    with session.tx():\n        d = get_draft(session, draft_id)\n        if d[\"status\"] not in (\"draft\", \"approved\"):\n            raise WorkflowError(\"bad_state\", f\"draft is {d['status']} and can no longer be edited\")\n        ctx = TextContext.from_dict(json.loads(d[\"allowed_json\"]))\n        warnings = [v.to_dict() for v in check_text(body, ctx)]\n        if any(w[\"rule\"] == \"shape\" for w in warnings):\n            raise WorkflowError(\"bad_text\", \"; \".join(w[\"detail\"] for w in warnings if w[\"rule\"] == \"shape\"))\n        session.run(\n            \"UPDATE drafts SET body = :body, status = 'draft', approved_body_hash = NULL, decided_by = NULL, \"\n            \"decided_at = NULL, written_by = :by WHERE shop_id = :shop_id AND id = :id\",\n            id=draft_id, body=body,\n            by=d[\"written_by\"] if d[\"written_by\"].endswith(\"+edited\") else d[\"written_by\"] + \"+edited\",\n        )\n        out = get_draft(session, draft_id)\n        out[\"warnings\"] = warnings\n        return out\n\n\ndef _withdraw_offer(session: ShopSession, draft_id: str) -> None:\n    session.run(\n        \"UPDATE offers SET status = 'withdrawn' WHERE shop_id = :shop_id AND draft_id = :id AND status = 'proposed'\",\n        id=draft_id,\n    )\n\n\ndef reject(session: ShopSession, draft_id: str, actor: str, now: datetime) -> dict[str, Any]:\n    if not is_human(actor):\n        raise WorkflowError(\"not_human\", \"only a person can reject a draft\")\n    with session.tx():\n        d = get_draft(session, draft_id)\n        if d[\"status\"] not in (\"draft\", \"approved\"):\n            raise WorkflowError(\"bad_state\", f\"draft is {d['status']}\")\n        session.run(\n            \"UPDATE drafts SET status = 'rejected', decided_by = :actor, decided_at = :at, approved_body_hash = NULL \"\n            \"WHERE shop_id = :shop_id AND id = :id\",\n            id=draft_id, actor=actor, at=iso(now),\n        )\n        _withdraw_offer(session, draft_id)\n        return get_draft(session, draft_id)\n\n\ndef expire_for_closed_quotes(session: ShopSession, closed_quote_ids: set[str]) -> list[str]:\n    \"\"\"A draft about a quote that has since closed is expired, not left to be sent.\"\"\"\n    expired = []\n    with session.tx():\n        for d in session.rows(\n            \"SELECT id, quote_id FROM drafts WHERE shop_id = :shop_id AND status IN ('draft', 'approved')\"\n        ):\n            if d[\"quote_id\"] in closed_quote_ids:\n                session.run(\n                    \"UPDATE drafts SET status = 'expired', status_reason = 'quote closed' \"\n                    \"WHERE shop_id = :shop_id AND id = :id\",\n                    id=d[\"id\"],\n                )\n                _withdraw_offer(session, d[\"id\"])\n                expired.append(d[\"id\"])\n    return expired\n", "followup/state/__init__.py": "\"\"\"State, signals and baselines. Pure functions over rows.\"\"\"\nfrom .baselines import Baseline, compute_baselines\nfrom .projector import QuoteState, project\nfrom .signals import Signals, Windows, compute_signals\n\n__all__ = [\"Baseline\", \"compute_baselines\", \"QuoteState\", \"project\", \"Signals\", \"Windows\", \"compute_signals\"]\n", "followup/state/baselines.py": "\"\"\"Per shop medians.\n\nThresholds are derived from these, so a shop selling small repairs and a shop selling\nlarge installs get different lines without anyone setting them.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import datetime, timedelta\nfrom statistics import median\nfrom typing import Iterable, Mapping\n\nfrom ..platform.timeutil import hours_between\nfrom .projector import QuoteState\n\nMETRICS = (\"amount\", \"first_view\", \"first_contact\", \"view_gap\", \"view_to_reply\", \"time_to_accept\")\n\n\n@dataclass(frozen=True)\nclass Baseline:\n    metric: str\n    value: float\n    sample_n: int\n    source: str            # shop, parent, platform\n    shop_value: float | None = None   # the shop's own median even when it was not used\n\n    def to_dict(self) -> dict:\n        return {\"metric\": self.metric, \"value\": self.value, \"sample_n\": self.sample_n,\n                \"source\": self.source, \"shop_value\": self.shop_value}\n\n\ndef samples(states: Iterable[QuoteState], now: datetime, window_days: int) -> dict[str, list[float]]:\n    \"\"\"Raw samples per metric, from quotes created inside the trailing window.\"\"\"\n    cutoff = now - timedelta(days=window_days)\n    out: dict[str, list[float]] = {m: [] for m in METRICS}\n    for s in states:\n        if s.created_at < cutoff:\n            continue\n        out[\"amount\"].append(float(s.amount_cents))\n        if s.views:\n            out[\"first_view\"].append(hours_between(s.created_at, s.views[0]))\n            out[\"view_gap\"].extend(hours_between(a, b) for a, b in zip(s.views, s.views[1:]))\n        if s.contacts:\n            out[\"first_contact\"].append(hours_between(s.created_at, s.contacts[0]))\n        if s.replies:\n            first_reply = s.replies[0][0]\n            prior_views = [v for v in s.views if v <= first_reply]\n            if prior_views:\n                out[\"view_to_reply\"].append(hours_between(prior_views[-1], first_reply))\n        if s.accepted_at:\n            out[\"time_to_accept\"].append(hours_between(s.created_at, s.accepted_at))\n    return out\n\n\ndef compute_baselines(\n    states: Iterable[QuoteState],\n    now: datetime,\n    min_samples: int,\n    window_days: int,\n    platform: Mapping[str, float],\n    parent: Mapping[str, Baseline] | None = None,\n) -> dict[str, Baseline]:\n    \"\"\"Median per metric. Too few samples falls back to the parent, then the platform.\"\"\"\n    data = samples(states, now, window_days)\n    result: dict[str, Baseline] = {}\n    for metric in METRICS:\n        xs = data[metric]\n        own = float(median(xs)) if xs else None\n        if len(xs) >= min_samples:\n            result[metric] = Baseline(metric, own, len(xs), \"shop\", own)\n        elif parent and metric in parent and parent[metric].sample_n >= min_samples:\n            result[metric] = Baseline(metric, parent[metric].value, len(xs), \"parent\", own)\n        else:\n            result[metric] = Baseline(metric, float(platform[metric]), len(xs), \"platform\", own)\n    return result\n", "followup/state/projector.py": "\"\"\"Fold events into per quote state.\n\nEvery operation here is order independent: sets, sorted lists, maxima. Shuffled or\nduplicated input therefore gives the same state. Nothing reads arrival order.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import datetime\nfrom typing import Any, Iterable\n\nfrom ..platform.timeutil import parse\n\n\n@dataclass\nclass QuoteState:\n    quote_id: str\n    customer_id: str\n    customer_name: str\n    tech_name: str\n    amount_cents: int\n    created_at: datetime\n    status: str                      # open, accepted, dismissed\n    views: list[datetime] = field(default_factory=list)\n    replies: list[tuple[datetime, str | None]] = field(default_factory=list)\n    contacts: list[datetime] = field(default_factory=list)   # every outbound touch we know of\n    accepted_at: datetime | None = None\n\n    @property\n    def closed(self) -> bool:\n        return self.status != \"open\"\n\n    @property\n    def last_contact(self) -> datetime | None:\n        return self.contacts[-1] if self.contacts else None\n\n    @property\n    def last_reply(self) -> datetime | None:\n        return self.replies[-1][0] if self.replies else None\n\n    @property\n    def reply_channel(self) -> str | None:\n        return self.replies[-1][1] if self.replies else None\n\n    @property\n    def last_view(self) -> datetime | None:\n        return self.views[-1] if self.views else None\n\n\ndef project(quotes: Iterable[dict[str, Any]], events: Iterable[dict[str, Any]], now: datetime) -> dict[str, QuoteState]:\n    \"\"\"Build state for every quote that exists at `now`. Events later than `now` are ignored.\"\"\"\n    states: dict[str, QuoteState] = {}\n    field_contacts: dict[str, datetime] = {}\n    for q in quotes:\n        created = parse(q[\"created_at\"])\n        if created > now:\n            continue\n        states[q[\"id\"]] = QuoteState(\n            quote_id=q[\"id\"],\n            customer_id=q[\"customer_id\"],\n            customer_name=q.get(\"customer_name\", \"\"),\n            tech_name=q.get(\"tech_name\", \"\"),\n            amount_cents=int(q[\"amount_cents\"]),\n            created_at=created,\n            status=q.get(\"status\", \"open\"),\n        )\n        if q.get(\"last_contact_at\"):\n            stamp = parse(q[\"last_contact_at\"])\n            if stamp <= now:\n                field_contacts[q[\"id\"]] = stamp\n\n    views: dict[str, set[datetime]] = {}\n    replies: dict[str, set[tuple[datetime, str | None]]] = {}\n    contacts: dict[str, set[datetime]] = {qid: {stamp} for qid, stamp in field_contacts.items()}\n    accepted: dict[str, datetime] = {}\n\n    seen: set[str] = set()\n    for e in events:\n        if e[\"event_id\"] in seen:      # the log already dedupes, this keeps the fold safe alone\n            continue\n        seen.add(e[\"event_id\"])\n        qid = e.get(\"quote_id\")\n        if qid not in states:\n            continue\n        at = parse(e[\"occurred_at\"])\n        if at > now:\n            continue\n        kind = e[\"type\"]\n        if kind == \"quote_viewed\":\n            views.setdefault(qid, set()).add(at)\n        elif kind == \"customer_replied\":\n            replies.setdefault(qid, set()).add((at, e.get(\"channel\")))\n        elif kind == \"message_sent\":\n            if (e.get(\"direction\") or \"outbound\") == \"outbound\":\n                contacts.setdefault(qid, set()).add(at)\n            else:\n                replies.setdefault(qid, set()).add((at, e.get(\"channel\")))\n        elif kind == \"quote_accepted\":\n            accepted[qid] = min(at, accepted.get(qid, at))\n        # quote_sent is the quote going out, not a follow-up. Unknown types are ignored.\n\n    for qid, state in states.items():\n        state.views = sorted(views.get(qid, ()))\n        state.replies = sorted(replies.get(qid, ()), key=lambda r: (r[0], r[1] or \"\"))\n        state.contacts = sorted(contacts.get(qid, ()))\n        if qid in accepted:\n            state.accepted_at = accepted[qid]\n            # Closed is sticky. An event can close a quote, nothing reopens it.\n            if state.status == \"open\":\n                state.status = \"accepted\"\n    return states\n", "followup/state/signals.py": "\"\"\"Signals for one quote, computed from its state and a set of time windows.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import asdict, dataclass\nfrom datetime import datetime\n\nfrom ..platform.timeutil import hours_between, iso\nfrom .projector import QuoteState\n\n\n@dataclass(frozen=True)\nclass Windows:\n    \"\"\"Time windows in hours. Built from the shop's baselines by the policy module.\"\"\"\n    hot_window: float\n    burst_window: float\n    burst_views: int\n    returned_gap: float\n    never_viewed_after: float\n    fresh_hold: float\n    live_conversation_hold: float\n    median_amount_cents: float\n\n\n@dataclass(frozen=True)\nclass Signals:\n    awaiting_our_reply: bool\n    viewed_since_contact: bool\n    views_since_contact: int\n    view_burst: bool\n    returned_after_gap: bool\n    never_viewed: bool\n    never_contacted: bool\n    unanswered_attempts: int\n    hours_since_contact: float\n    age_hours: float\n    amount_ratio: float\n    reply_channel: str | None\n    last_view: str | None\n    hold: str | None                 # fresh, live_conversation, or None\n\n    def to_dict(self) -> dict:\n        d = asdict(self)\n        d[\"hours_since_contact\"] = round(self.hours_since_contact, 1)\n        d[\"age_hours\"] = round(self.age_hours, 1)\n        d[\"amount_ratio\"] = round(self.amount_ratio, 2)\n        return d\n\n\ndef compute_signals
